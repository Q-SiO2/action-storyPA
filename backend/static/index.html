<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070a" />
    <title>Palo Alto — Contrôleur d'équipe</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305070a'/%3E%3Cpath d='M8 24L24 8M8 8h16v16' stroke='%2333e6ff' stroke-width='2' fill='none'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <span class="mark">↗</span>
        <div>
          <strong>PALO ALTO</strong><small>COMMUNICATION SIMULATOR</small>
        </div>
        <span class="signal-dot" id="connection-dot"></span>
      </header>
      <div class="experience" aria-label="Préférences">
        <button id="sound-toggle" type="button" aria-pressed="false">
          SON / OFF</button
        ><button id="motion-toggle" type="button" aria-pressed="true">
          EFFETS / ON
        </button>
      </div>
      <div id="identity" class="identity" hidden></div>
      <section id="view"></section>
      <p id="feedback" role="status" aria-live="polite"></p>
      <footer>
        <span>LES SIGNAUX FAIBLES</span><span id="network">CANAL / LOCAL</span>
      </footer>
    </main>
  </body>
</html>
